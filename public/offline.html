<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080808;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-size:28px;margin:0 0 12px}
  p{color:#9a9a9a;max-width:320px;margin:0 auto 24px;line-height:1.5}
  button{background:#6c579e;color:#fff;border:0;padding:14px 28px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
  <div>
    <h1>You are offline</h1>
    <p>Lessons need an internet connection. Check your data or Wi-Fi, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
